# Cloudflare Worker：連線房間伺服器（免費方案：Workers Free＋SQLite 版 Durable Objects，不需要信用卡）
name = "obod-online"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# 網址會是 https://obod-online.one-board-one-deck.workers.dev
workers_dev = true

[vars]
# 允許連線的來源：GitHub Pages 網頁版、Android App（Capacitor 預設 https://localhost）、iOS（capacitor://localhost）
ALLOWED_ORIGINS = "https://archie-30.github.io,https://localhost,capacitor://localhost"
# 本機開發（npm run dev）會另外打開 ALLOW_LOCAL
ALLOW_LOCAL = "0"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "Directory"

# 免費方案只能用 SQLite 版的 Durable Objects
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Directory"]
